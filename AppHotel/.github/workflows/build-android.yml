name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Instalar .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Instalar workload MAUI
        run: dotnet workload install maui-android

      - name: Gerar APK
        run: dotnet publish AppHotel/AppHotel.csproj -f net10.0-android -c Release -p:AndroidPackageFormat=apk

      - name: Salvar APK
        uses: actions/upload-artifact@v4
        with:
          name: AppHotel-APK
          path: AppHotel/bin/Release/net10.0-android/publish/*.apk
